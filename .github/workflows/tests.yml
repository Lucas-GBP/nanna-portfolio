name: Node.js CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: "npm"

      - run: npm ci

      - run: npm run typecheck